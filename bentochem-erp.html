<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>벤토케미칼 통합 ERP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 탭 바 + 단일 컬럼 작업면. 숫자는 모노 탭형, 지표 코드는 장부식 태그 */
:root{
  --bg:#f5f5f3; --surface:#ffffff; --line:#e2dfda; --fg:#1f1b17; --muted:#665f57;
  --accent:#8f4f1c; --accent-soft:#f6e9de; --accent-fg:#ffffff;
  --warn:#a15c07; --bad:#b42318;
  --s1:#8f4f1c; --s2:#3a6fb0; --s3:#b0713a; --s4:#7a5bb0; --s5:#4f8a2e; --s6:#b04a6a; --s7:#2c8aa0; --s8:#8a7a2c;
  --f-body:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151311; --surface:#1d1a17; --line:#35302b; --fg:#efe9e3; --muted:#a89f96;
  --accent:#e2a36b; --accent-soft:#3a2a1c; --accent-fg:#1a120b;
  --warn:#e3a54a; --bad:#f07a6e;
  --s1:#e2a36b; --s2:#7aa7e6; --s3:#e0a46e; --s4:#b39be6; --s5:#8cc66a; --s6:#e68aa6; --s7:#6cc6dc; --s8:#d6c46a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151311; --surface:#1d1a17; --line:#35302b; --fg:#efe9e3; --muted:#a89f96;
  --accent:#e2a36b; --accent-soft:#3a2a1c; --accent-fg:#1a120b;
  --warn:#e3a54a; --bad:#f07a6e;
  --s1:#e2a36b; --s2:#7aa7e6; --s3:#e0a46e; --s4:#b39be6; --s5:#8cc66a; --s6:#e68aa6; --s7:#6cc6dc; --s8:#d6c46a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);border-radius:2px;display:inline-block}
nav{display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;font-weight:500}
nav a:hover{color:var(--fg);background:var(--bg)}
nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
main.wrap{padding-block:24px 48px;display:grid;gap:16px}
h1{font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.015em}
.lead{color:var(--muted);margin:4px 0 0;max-width:68ch}
h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.note{color:var(--muted);font-size:12.5px}
select,input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--surface);color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag{font-family:var(--f-num);font-size:11px;font-weight:500;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-weight:500}
.badge.last{background:color-mix(in srgb,var(--s2) 16%,transparent);color:var(--s2)}
.badge.avg{background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3)}
.badge.calc{background:color-mix(in srgb,var(--s4) 16%,transparent);color:var(--s4)}
.pass{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--s5) 16%,transparent);color:var(--s5)}
.fail{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.qc .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.qc .v{font-family:var(--f-num);font-size:24px;font-variant-numeric:tabular-nums}
.qc .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:4px}
.qc.bad{border-color:var(--bad)}
.rule{margin:12px 0 0;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-num);font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:4px;font-weight:400}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--bg)}
td.n,th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.sum th,tr.sum td{border-top:2px solid var(--line)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-num)}
.chart .grid{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.g2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
.form input,.form select{width:100%}
.why{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sample{font-size:11px;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:8px;border:1px dashed var(--warn);color:var(--warn);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
main a{color:var(--accent);text-underline-offset:2px}
nav{overflow-x:auto;max-width:100%;scrollbar-width:thin}
nav a{white-space:nowrap}
textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-height:110px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.tiles.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile .d{font-size:12px;color:var(--muted);margin-top:4px}
.up{color:var(--s5)} .down{color:var(--bad)}
.side{display:flex;gap:6px;flex-wrap:wrap}
.side a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);font-size:13px;background:var(--surface)}
.side a[aria-current="page"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);border-top:1px solid var(--line)}
.kv>div{padding:8px 10px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){color:var(--muted);font-size:13px;background:var(--bg)}
.kv .miss{color:var(--bad);font-size:13px}
.warn-b{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.preview{white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%}
.list{display:grid;gap:8px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{min-width:0;overflow-wrap:anywhere}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.vars code{font-family:var(--f-num);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
@media (max-width:900px){.g3,.g21{grid-template-columns:minmax(0,1fr)}.tiles.t5{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kv{grid-template-columns:minmax(0,1fr)}.kv>div:nth-child(odd){border-bottom:0;padding-bottom:2px}}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.status{margin-left:0;width:100%}}
@media (max-width:420px){.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i></i>벤토케미칼 통합 ERP</div>
  <nav aria-label="화면">
    <a href="#dash" id="nav-dash">대시보드</a>
    <a href="#agg" id="nav-agg">집계 분석</a>
    <a href="#qc" id="nav-qc">품질 현황</a>
    <a href="#entry" id="nav-entry">지표 입력</a>
    <a href="#info-A" id="nav-info">기업정보</a>
    <a href="#apply" id="nav-apply">신청서 작성</a>
    <a href="#alerts" id="nav-alerts">만료 알림</a>
    <a href="#data" id="nav-data">데이터 관리</a>
  </nav>
  <span class="status" id="status">연결 중…</span>
</div></header>
<main class="wrap" id="app"><div class="card empty">데이터를 불러오는 중입니다. 처음 쓰신다면 「기업정보」에서 회사 정보를, 「지표 입력」에서 첫 값을 넣으세요.</div></main>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- 지표 정의: agg = sum(합계) / last(기말값) / avg(평균) / calc(계산) ---------- */
const SECTIONS=[{c:'A',n:'매출·수주'},{c:'P',n:'생산·출하·재고'},{c:'Q',n:'품질시험 (TG공법 뒤채움재)'},{c:'F',n:'재무·인력'},{c:'R',n:'비율 (자동 계산)'}];
const PRODUCTS=['특수벤토','가소성시멘트','안정제','특수규산'];
const SITE_HINT='현장 또는 로트 (예: 동서울-신가평1차 전력구)';
const METRICS=[
 {id:'revenue',code:'A-1',sec:'A',label:'매출액',unit:'백만원',agg:'sum',dims:[...PRODUCTS,'시공·기타']},
 {id:'orders',code:'A-2',sec:'A',label:'수주액',unit:'백만원',agg:'sum',dims:'free',dimHint:'현장명 (예: 동서울-신가평1차 전력구)'},
 {id:'op_profit',code:'A-3',sec:'A',label:'영업이익',unit:'백만원',agg:'sum'},
 {id:'production',code:'P-1',sec:'P',label:'생산량',unit:'톤',agg:'sum',dims:PRODUCTS},
 {id:'shipment',code:'P-2',sec:'P',label:'출하량',unit:'톤',agg:'sum',dims:PRODUCTS},
 {id:'ore_in',code:'P-3',sec:'P',label:'원광 입고량',unit:'톤',agg:'sum',dims:'free',dimHint:'광산·산지 (예: 경주)'},
 {id:'stock',code:'P-4',sec:'P',label:'제품 재고',unit:'톤',agg:'last',dims:PRODUCTS},
 {id:'utilization',code:'P-5',sec:'P',label:'설비 가동률',unit:'%',agg:'avg'},
 {id:'bleeding',code:'Q-1',sec:'Q',label:'A액 재료분리 (블리딩)',unit:'%',agg:'avg',spec:{max:5},specText:'3시간 방치 후 5% 이하',dims:'free',dimHint:SITE_HINT},
 {id:'viscosity',code:'Q-2',sec:'Q',label:'A액 판넬 점도',unit:'초',agg:'avg',spec:{min:32,max:38},specText:'32~38초',dims:'free',dimHint:SITE_HINT},
 {id:'geltime',code:'Q-3',sec:'Q',label:'A+B액 겔타임',unit:'초',agg:'avg',spec:{max:6},specText:'상온 6초 이내',dims:'free',dimHint:SITE_HINT},
 {id:'plastic_time',code:'Q-4',sec:'Q',label:'가소상태 유지시간',unit:'분',agg:'avg',spec:{min:15},specText:'15분 이상',dims:'free',dimHint:SITE_HINT},
 {id:'ucs_1h',code:'Q-5',sec:'Q',label:'일축압축강도 1시간',unit:'MPa',agg:'avg',spec:{min:0.05},specText:'0.05MPa 이상 (습윤양생, 5cm 큐빅몰드)',dims:'free',dimHint:SITE_HINT},
 {id:'ucs_28d',code:'Q-6',sec:'Q',label:'일축압축강도 28일',unit:'MPa',agg:'avg',spec:{min:2.0},specText:'2.0MPa 이상 (수중양생, 5cm 큐빅몰드)',dims:'free',dimHint:SITE_HINT},
 {id:'qc_tests',code:'Q-7',sec:'Q',label:'품질시험 건수',unit:'건',agg:'sum'},
 {id:'qc_fails',code:'Q-8',sec:'Q',label:'부적합 건수',unit:'건',agg:'sum'},
 {id:'headcount',code:'F-1',sec:'F',label:'상시근로자',unit:'명',agg:'last',dims:['생산','품질·연구','시공','관리·영업']},
 {id:'rnd_cost',code:'F-2',sec:'F',label:'R&D 투자',unit:'백만원',agg:'sum'},
 {id:'assets',code:'F-3',sec:'F',label:'자산총계',unit:'백만원',agg:'last'},
 {id:'liabilities',code:'F-4',sec:'F',label:'부채총계',unit:'백만원',agg:'last'},
 {id:'equity',code:'F-5',sec:'F',label:'자본총계',unit:'백만원',agg:'last'},
 {id:'cur_assets',code:'F-6',sec:'F',label:'유동자산',unit:'백만원',agg:'last'},
 {id:'cur_liab',code:'F-7',sec:'F',label:'유동부채',unit:'백만원',agg:'last'},
 {id:'op_margin',code:'R-1',sec:'R',label:'영업이익률',unit:'%',agg:'calc',deps:['op_profit','revenue']},
 {id:'ship_ratio',code:'R-2',sec:'R',label:'생산 대비 출하율',unit:'%',agg:'calc',deps:['shipment','production']},
 {id:'fail_rate',code:'R-3',sec:'R',label:'품질 부적합률',unit:'%',agg:'calc',deps:['qc_fails','qc_tests']},
 {id:'debt_ratio',code:'R-4',sec:'R',label:'부채비율',unit:'%',agg:'calc',deps:['liabilities','equity']},
 {id:'rnd_ratio',code:'R-5',sec:'R',label:'R&D 투자비중',unit:'%',agg:'calc',deps:['rnd_cost','revenue']},
 {id:'cur_ratio',code:'R-6',sec:'R',label:'유동비율',unit:'%',agg:'calc',deps:['cur_assets','cur_liab']},
];
function judge(m,v){ if(!m.spec||v==null||!isFinite(v)) return ''; const ok=(m.spec.min==null||v>=m.spec.min)&&(m.spec.max==null||v<=m.spec.max); return ok?'<span class="pass">적합</span>':'<span class="fail">부적합</span>'; }
function isOk(m,v){ return (m.spec.min==null||v>=m.spec.min)&&(m.spec.max==null||v<=m.spec.max); }
const MET=Object.fromEntries(METRICS.map(m=>[m.id,m]));
const AGG_LABEL={sum:'합계',last:'기말값',avg:'평균',calc:'계산'};
const AGG_RULE={
 sum:'기간 안에 입력한 값을 모두 더합니다. 매출은 계산서 발행일, 채용은 입사일 기준으로 입력하세요.',
 last:'기간 말 시점의 최신값을 씁니다. 값이 없는 기간은 직전 값을 이월합니다. 구분이 있으면 구분별 최신값을 더합니다.',
 avg:'기간 안에 입력한 측정값의 단순 평균입니다.',
 calc:'두 지표의 같은 기간 집계값으로 계산합니다 (분자 ÷ 분모 × 100).'};
const UNITS=[['week','주'],['month','월'],['quarter','분기'],['year','년']];
const PALETTE=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];

/* ---------- 상태 ---------- */
let ENTRIES=[]; let db=null; let col=null; let loaded=false; let canWrite=true;
const UI={unit:'month',metric:'revenue',from:'',to:'',entryMetric:'revenue',filter:'',tpl:'general',year:'',editRec:null};
try{const u=JSON.parse(localStorage.getItem('bentochem-ui')||'null'); if(u) Object.assign(UI,u,{from:'',to:''});}catch(e){}
function saveUI(){try{localStorage.setItem('bentochem-ui',JSON.stringify({unit:UI.unit,metric:UI.metric,entryMetric:UI.entryMetric}));}catch(e){}}

/* ---------- 유틸 ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function fmt(v,dec){ if(v==null||!isFinite(v)) return '–'; const d=dec??(Math.abs(v)<100&&v%1!==0?1:0); return v.toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:0}); }
function toast(t){const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2200);}
const D=s=>{const [a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c||1));};
const DS=x=>x.toISOString().slice(0,10);
const today=()=>DS(new Date(Date.now()-new Date().getTimezoneOffset()*60000));
function pStart(x,u){const y=x.getUTCFullYear(),m=x.getUTCMonth();
  if(u==='year')return new Date(Date.UTC(y,0,1)); if(u==='quarter')return new Date(Date.UTC(y,m-m%3,1));
  if(u==='month')return new Date(Date.UTC(y,m,1)); const r=new Date(x); r.setUTCDate(r.getUTCDate()-((r.getUTCDay()+6)%7)); return r;}
function pNext(x,u){const r=new Date(x); if(u==='year')r.setUTCFullYear(r.getUTCFullYear()+1); else if(u==='quarter')r.setUTCMonth(r.getUTCMonth()+3); else if(u==='month')r.setUTCMonth(r.getUTCMonth()+1); else r.setUTCDate(r.getUTCDate()+7); return r;}
function pKey(x,u){const y=x.getUTCFullYear(),m=x.getUTCMonth()+1;
  if(u==='year')return ''+y; if(u==='quarter')return y+'-Q'+Math.ceil(m/3); if(u==='month')return y+'-'+String(m).padStart(2,'0'); return DS(x);}
function pLabel(p,u){ if(u==='week'){const [y,m,d]=p.key.split('-');return `${+m}/${+d}주`;} if(u==='month'){const [y,m]=p.key.split('-');return `${y.slice(2)}.${m}`;} if(u==='quarter') return p.key.slice(2).replace('-',' '); return p.key; }
function periods(from,to,u){const out=[]; let s=pStart(D(from),u); const end=D(to);
  while(s<=end && out.length<400){const n=pNext(s,u); const e=new Date(n); e.setUTCDate(e.getUTCDate()-1); out.push({key:pKey(s,u),start:DS(s),end:DS(e)}); s=n;} return out;}
function dataRange(){ const ds=ENTRIES.map(e=>e.date).filter(Boolean).sort(); const t=today();
  if(!ds.length){const y=t.slice(0,4);return [y+'-01-01',t];} return [ds[0], ds[ds.length-1]>t?ds[ds.length-1]:t]; }

/* ---------- 집계 엔진 ---------- */
function byMetric(id){return ENTRIES.filter(e=>e.metric===id&&e.date&&isFinite(e.value)).sort((a,b)=>a.date.localeCompare(b.date));}
function series(id,ps){ const m=MET[id];
  if(m.agg==='calc'){const A=series(m.deps[0],ps),B=series(m.deps[1],ps);
    return ps.map((p,i)=>{const a=A[i].total,b=B[i].total; return {...p,dims:{},total:(a==null||!b)?null:a/b*100};});}
  const es=byMetric(id);
  return ps.map(p=>{ const dims={}; let total=null;
    if(m.agg==='last'){ const lastBy={}; for(const e of es){ if(e.date>p.end)break; lastBy[e.dim||'(미지정)']=e.value; }
      for(const k in lastBy){dims[k]=lastBy[k]; total=(total||0)+lastBy[k];} }
    else { let n=0; const cnt={}; for(const e of es){ if(e.date<p.start)continue; if(e.date>p.end)break; const k=e.dim||'(미지정)'; dims[k]=(dims[k]||0)+e.value; cnt[k]=(cnt[k]||0)+1; total=(total||0)+e.value; n++; }
      if(m.agg==='avg'&&n){ total=total/n; for(const k in dims) dims[k]=dims[k]/cnt[k]; } }
    return {...p,dims,total}; }); }

/* ---------- 차트 (SVG) ---------- */
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function chart({labels,stacks,unit,line}){
  const W=760,H=270,L=58,R=14,T=14,B=34, iw=W-L-R, ih=H-T-B, n=labels.length||1;
  const tops=labels.map((_,i)=>line?Math.max(...stacks.map(s=>s.vals[i]??-Infinity)):stacks.reduce((a,s)=>a+Math.max(0,s.vals[i]||0),0));
  const mx=niceMax(Math.max(0,...tops.filter(isFinite)));
  const Y=v=>T+ih-(v/mx)*ih, X=i=>L+iw*(i+.5)/n, bw=Math.max(2,Math.min(38,iw/n*.62));
  let g=''; for(let k=0;k<=4;k++){const v=mx*k/4; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${esc(fmt(v))}</text>`;}
  const step=Math.ceil(n/12); labels.forEach((lb,i)=>{ if(i%step===0) g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle">${esc(lb)}</text>`; });
  let marks='';
  if(line){ stacks.forEach(s=>{ const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(Math.max(0,v))]);
      let d='',pen=false; pts.forEach(p=>{ if(!p){pen=false;return;} d+=(pen?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); pen=true; });
      const fp=pts.filter(Boolean); if(fp.length>1) marks+=`<path d="${d} L${fp[fp.length-1][0]} ${Y(0)} L${fp[0][0]} ${Y(0)} Z" fill="var(${s.color})" opacity=".08"/>`;
      marks+=`<path d="${d}" fill="none" stroke="var(${s.color})" stroke-width="2.2"/>`;
      pts.forEach((p,i)=>{ if(p) marks+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="var(${s.color})"><title>${esc(labels[i])} ${esc(s.name)}: ${esc(fmt(s.vals[i]))} ${esc(unit)}</title></circle>`; }); }); }
  else { labels.forEach((lb,i)=>{ let acc=0; stacks.forEach(s=>{ const v=Math.max(0,s.vals[i]||0); if(!v)return; const y1=Y(acc+v),y2=Y(acc); acc+=v;
      marks+=`<rect x="${X(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(.5,y2-y1)}" fill="var(${s.color})" rx="2"><title>${esc(lb)} ${esc(s.name)}: ${esc(fmt(v))} ${esc(unit)}</title></rect>`; }); }); }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="집계 차트">${g}<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>${marks}</svg></div>`; }
const legend=st=>`<div class="legend">${st.map(s=>`<span><i style="background:var(${s.color})"></i>${esc(s.name)}</span>`).join('')}</div>`;
const badge=a=>`<span class="badge ${a}">${AGG_LABEL[a]}</span>`;

/* ---------- 화면: 집계 분석 ---------- */
function metricOptions(sel,filter){ return SECTIONS.map(sc=>{const ms=METRICS.filter(x=>x.sec===sc.c&&(!filter||filter(x))); return ms.length?`<optgroup label="${sc.c}. ${esc(sc.n)}">${ms.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${x.code} ${esc(x.label)} (${esc(x.unit)} · ${AGG_LABEL[x.agg]})</option>`).join('')}</optgroup>`:'';}).join(''); }
function vAgg(){
  const [r0,r1]=dataRange(); const from=UI.from||r0.slice(0,4)+'-01-01', to=UI.to||r1;
  const m=MET[UI.metric]||METRICS[0]; const ps=periods(from,to,UI.unit); const sr=series(m.id,ps);
  const dimNames=m.agg==='calc'?[]:[...new Set(sr.flatMap(p=>Object.keys(p.dims)))].sort((a,b)=>Array.isArray(m.dims)?m.dims.indexOf(a)-m.dims.indexOf(b):a.localeCompare(b,'ko'));
  const useDims=dimNames.length>1||(dimNames.length===1&&dimNames[0]!=='(미지정)');
  const isLine=m.agg!=='sum';
  const stacks=useDims&&!isLine?dimNames.map((dn,i)=>({name:dn,color:PALETTE[i%8],vals:sr.map(p=>p.dims[dn]??null)})):[{name:m.label,color:'--s1',vals:sr.map(p=>p.total)}];
  const vals=sr.map(p=>p.total).filter(v=>v!=null);
  const tot=m.agg==='sum'?vals.reduce((a,v)=>a+v,0):null;
  const dec=m.unit==='%'||m.unit==='MPa'?2:undefined;
  window._agg={m,sr,dimNames:useDims?dimNames:[]};
  const uname=UNITS.find(u=>u[0]===UI.unit)[1];
  return `<div><h1>집계 분석</h1><p class="lead">매출·생산·출하·품질시험 지표를 정해진 합산 기준(합계·기말값·평균·계산)에 따라 주·월·분기·년 단위로 집계합니다.</p></div>
  ${sampleBanner()}
  <div class="card"><div class="row">
    <select id="f-metric" aria-label="지표" style="max-width:340px">${metricOptions(m.id)}</select>
    <div class="seg" role="group" aria-label="집계 단위">${UNITS.map(([k,l])=>`<button data-unit="${k}" aria-pressed="${UI.unit===k}">${l}</button>`).join('')}</div>
    <span class="note">기간</span><input id="f-from" type="date" value="${from}" aria-label="시작일"><span>~</span><input id="f-to" type="date" value="${to}" aria-label="종료일">
    <span class="sp"></span><button class="btn" id="b-copy">표 복사</button><button class="btn" id="b-csv">CSV 저장</button>
  </div>
  <p class="rule">${m.spec?`품질기준 <b>${esc(m.specText)}</b> · `:''}합산 기준 ${badge(m.agg)} ${esc(AGG_RULE[m.agg])}${m.agg==='calc'?` <b>${esc(MET[m.deps[0]].label)} ÷ ${esc(MET[m.deps[1]].label)} × 100</b>`:''}</p></div>
  <div class="tiles">
    <div class="tile"><div class="l">${m.agg==='sum'?'기간 합계':'최근 기간 값'}</div><div class="v">${fmt(m.agg==='sum'?tot:vals[vals.length-1],dec)}<small>${esc(m.unit)}</small></div></div>
    <div class="tile"><div class="l">${uname} 평균</div><div class="v">${fmt(vals.length?vals.reduce((a,v)=>a+v,0)/vals.length:null,dec)}<small>${esc(m.unit)}</small></div></div>
    <div class="tile"><div class="l">최고</div><div class="v">${fmt(vals.length?Math.max(...vals):null,dec)}<small>${esc(m.unit)}</small></div></div>
    <div class="tile"><div class="l">집계 기간 수</div><div class="v">${ps.length}<small>${uname}</small></div></div>
  </div>
  <div class="card"><h2>${esc(m.label)} · ${uname}별 <span class="tag">${m.code}</span></h2>
    ${vals.length?chart({labels:ps.map(p=>pLabel(p,UI.unit)),stacks,unit:m.unit,line:isLine})+(stacks.length>1?legend(stacks):''):`<div class="empty">이 기간에 「${esc(m.label)}」 값이 없습니다. 기간을 넓히거나 「지표 입력」에서 값을 넣으세요.</div>`}</div>
  <div class="card"><h2>집계표</h2><div class="tw"><table>
    <tr><th>기간</th>${useDims?dimNames.map(dn=>`<th class="n">${esc(dn)}</th>`).join(''):''}<th class="n">${m.agg==='sum'?'합계':AGG_LABEL[m.agg]} (${esc(m.unit)})</th>${m.spec?'<th>판정</th>':''}</tr>
    ${sr.map(p=>`<tr><td>${esc(p.key)}</td>${useDims?dimNames.map(dn=>`<td class="n">${fmt(p.dims[dn],dec)}</td>`).join(''):''}<td class="n"><b>${fmt(p.total,dec)}</b></td>${m.spec?`<td>${judge(m,p.total)}</td>`:''}</tr>`).join('')}
    ${m.agg==='sum'?`<tr class="sum"><th>합계</th>${useDims?dimNames.map(dn=>`<th class="n">${fmt(sr.reduce((a,p)=>a+(p.dims[dn]||0),0))}</th>`).join(''):''}<th class="n">${fmt(tot)}</th></tr>`:''}
  </table></div></div>
  <div class="card"><h2>지표 종합표 (연 단위)</h2><p class="why">모든 지표의 최근 연도별 값입니다. 사업계획서나 지원사업 신청서의 "최근 3개년 실적" 표에 그대로 옮길 수 있습니다.</p>${yearMatrix()}</div>`; }
function yearMatrix(){ const t=today().slice(0,4); const ys=[...new Set([...ENTRIES.map(e=>(e.date||'').slice(0,4)).filter(Boolean),t])].sort().slice(-4);
  const ps=ys.map(y=>({key:y,start:y+'-01-01',end:y+'-12-31'}));
  return `<div class="tw"><table><tr><th>코드</th><th>지표</th><th>단위</th><th>기준</th>${ys.map(y=>`<th class="n">${y}</th>`).join('')}</tr>${METRICS.map(m=>{const sr=series(m.id,ps);
    return `<tr><td><span class="tag">${m.code}</span></td><td><a href="#agg" data-goto="${m.id}" style="color:inherit">${esc(m.label)}</a></td><td class="note">${esc(m.unit)}</td><td>${badge(m.agg)}</td>${sr.map(p=>`<td class="n">${fmt(p.total,m.unit==='%'||m.unit==='MPa'?2:undefined)}</td>`).join('')}</tr>`;}).join('')}</table></div>`; }
function aggCsv(){ const {m,sr,dimNames}=window._agg||{}; if(!m) return ''; const q=s=>/[",\n]/.test(s)?`"${String(s).replace(/"/g,'""')}"`:s;
  const head=['기간',...dimNames,`${m.agg==='sum'?'합계':AGG_LABEL[m.agg]}(${m.unit})`].map(q);
  return [head.join(','),...sr.map(p=>[p.key,...dimNames.map(dn=>p.dims[dn]??''),p.total??''].map(v=>q(typeof v==='number'?+v.toFixed(4):v)).join(','))].join('\n'); }

/* ---------- 화면: 지표 입력 ---------- */
function vEntry(){ const m=MET[UI.entryMetric]&&MET[UI.entryMetric].agg!=='calc'?MET[UI.entryMetric]:MET.revenue;
  const list=ENTRIES.filter(e=>!UI.filter||e.metric===UI.filter).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.at||0)-(a.at||0)).slice(0,300);
  const dimInput=!m.dims?'':Array.isArray(m.dims)?`<label class="full" for="e-dim">구분<select id="e-dim" name="dim">${m.dims.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`:`<label class="full" for="e-dim">구분<input id="e-dim" name="dim" placeholder="${esc(m.dimHint||'')}" autocomplete="off"></label>`;
  const how=m.agg==='sum'?'발생한 날짜에 금액·수량을 입력합니다. 같은 기간 값은 자동으로 더해집니다.':m.agg==='last'?'측정 시점의 현재값을 입력합니다 (예: 월말 기준 인원, 결산일 기준 자산).':'측정할 때마다 값을 입력합니다. 기간 평균으로 집계됩니다.';
  return `<div><h1>지표 입력</h1><p class="lead">날짜 단위로 자유롭게 입력하면 집계 분석에서 지표별 기준에 맞게 합산됩니다. 비율 지표는 입력하지 않아도 자동 계산됩니다.</p></div>
  ${sampleBanner()}
  <div class="g2">
   <div class="card"><h2>한 건 입력 <span class="tag">${m.code}</span> ${badge(m.agg)}</h2><p class="why">${esc(how)}${m.spec?` 품질기준: <b>${esc(m.specText)}</b>`:''}</p>
    <form id="f-entry" class="form">
     <label class="full" for="e-metric">지표<select id="e-metric" name="metric">${metricOptions(m.id,x=>x.agg!=='calc')}</select></label>
     <label for="e-date">날짜<input id="e-date" name="date" type="date" value="${today()}" required></label>
     <label for="e-value">값 (${esc(m.unit)})<input id="e-value" name="value" type="number" step="any" inputmode="decimal" required placeholder="0"></label>
     ${dimInput}
     <label class="full" for="e-memo">메모<input id="e-memo" name="memo" placeholder="출처나 근거 (선택)" autocomplete="off"></label>
     <div class="full row"><button class="btn pri" type="submit" ${canWrite?'':'disabled'}>저장</button>${canWrite?'':'<span class="note">보기 권한만 있어 저장할 수 없습니다.</span>'}</div>
    </form></div>
   <div class="card"><div class="row" style="margin-bottom:10px"><h2 style="margin:0">입력 내역</h2><span class="note">${list.length}건</span><span class="sp"></span>
     <select id="f-filter" aria-label="지표 필터"><option value="">전체 지표</option>${METRICS.filter(x=>x.agg!=='calc').map(x=>`<option value="${x.id}" ${x.id===UI.filter?'selected':''}>${x.code} ${esc(x.label)}</option>`).join('')}</select></div>
    ${list.length?`<div class="tw"><table><tr><th>날짜</th><th>지표</th><th>구분</th><th class="n">값</th><th>메모</th><th></th></tr>
     ${list.map(e=>{const mm=MET[e.metric]; return `<tr><td>${esc(e.date)}</td><td>${esc(mm?mm.label:e.metric)}${e.sample?'<span class="sample">예시</span>':''}</td><td>${esc(e.dim||'')}</td><td class="n">${fmt(e.value,2)} <span class="note">${esc(mm?mm.unit:'')}</span> ${mm?judge(mm,e.value):''}</td><td class="note">${esc(e.memo||'')}</td><td>${canWrite?`<button class="btn sm ghost" data-del="${esc(e.id)}" aria-label="삭제">삭제</button>`:''}</td></tr>`;}).join('')}</table></div>`
     :`<div class="empty">아직 입력한 값이 없습니다. 왼쪽 양식으로 첫 값을 저장하세요.</div>`}
   </div></div>`; }
function sampleBanner(){ const n=ENTRIES.filter(e=>e.sample).length; if(!n) return '';
  return `<div class="banner">지금 보이는 값 중 ${n}건은 화면 구성을 보여 주기 위한 예시 데이터입니다. 실제 값을 넣기 전에 지우세요.<span class="sp"></span>${canWrite?'<button class="btn sm" id="b-clear-sample">예시 데이터 모두 삭제</button>':''}</div>`; }


/* ---------- 화면: 품질 현황 (TG공법 뒤채움재 실내시험 기준) ---------- */
function vQC(){ const qs=METRICS.filter(m=>m.spec);
  const cards=qs.map(m=>{ const es=byMetric(m.id); const last=es[es.length-1]; const n=es.length; const bad=es.filter(e=>!isOk(m,e.value)).length;
    return `<div class="qc ${last&&!isOk(m,last.value)?'bad':''}"><div class="h"><span>${esc(m.label)}</span><span class="tag">${m.code}</span></div>
      <div class="v">${last?fmt(last.value,2):'–'}<small>${esc(m.unit)}</small></div>
      <div class="row">${last?judge(m,last.value):'<span class="note">시험값 없음</span>'}<span class="note">기준 ${esc(m.specText)}</span></div>
      <div class="note">${last?`최근 ${esc(last.date)}${last.dim?' · '+esc(last.dim):''} · 누적 ${n}회 중 부적합 ${bad}회`:'「지표 입력」에서 시험 결과를 넣으세요.'}</div></div>`; }).join('');
  const rows=ENTRIES.filter(e=>MET[e.metric]&&MET[e.metric].spec).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.at||0)-(a.at||0)).slice(0,60);
  return `<div><h1>품질 현황</h1><p class="lead">가소상 뒤채움재(TG공법) 실내시험 항목별 최근 결과와 품질기준 충족 여부입니다. 각 시험값은 「지표 입력」에서 현장·로트를 구분해 넣습니다.</p></div>
  ${sampleBanner()}
  <div class="qgrid">${cards}</div>
  <div class="card"><h2>최근 시험 기록</h2>${rows.length?`<div class="tw"><table><tr><th>시험일</th><th>항목</th><th>현장·로트</th><th class="n">결과</th><th>기준</th><th>판정</th><th>메모</th></tr>
   ${rows.map(e=>{const m=MET[e.metric]; return `<tr><td>${esc(e.date)}</td><td>${esc(m.label)}${e.sample?'<span class="sample">예시</span>':''}</td><td>${esc(e.dim||'')}</td><td class="n">${fmt(e.value,2)} <span class="note">${esc(m.unit)}</span></td><td class="note">${esc(m.specText)}</td><td>${judge(m,e.value)}</td><td class="note">${esc(e.memo||'')}</td></tr>`;}).join('')}</table></div>`
   :`<div class="empty">아직 시험 기록이 없습니다.</div>`}</div>`; }

const INFO_BY=Object.fromEntries(INFO.map(s=>[s.id,s]));
let MASTER={}; let RECORDS=[];
const master=id=>MASTER[id]||{};
const recs=cat=>RECORDS.filter(r=>r.cat===cat).sort((a,b)=>(b.at||0)-(a.at||0));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:null;};
function daysTo(ds){return Math.round((D(ds)-D(today()))/864e5);}
function yp(id,y){return series(id,[{key:''+y,start:y+'-01-01',end:y+'-12-31'}])[0].total;}
function latestVal(id){return series(id,[{key:'now',start:'1900-01-01',end:today()}])[0].total;}
function ageYears(){const e=master('A').est_date;return e?(D(today())-D(e))/(365.25*864e5):null;}
const thisYear=()=>+today().slice(0,4);
function lastQc(id){const es=byMetric(id);return es[es.length-1];}
function companyName(){return master('A').name_ko||'벤토케미칼';}

/* ---------- 서술형 변수 ---------- */
function VARS(){ const y=thisYear(), py=y-1; const q=lastQc('ucs_28d');
  return {'회사명':companyName(),'업력':ageYears()==null?'':ageYears().toFixed(1)+'년','상시근로자':fmt(latestVal('headcount'))+'명',
   [`매출_전년`]:fmt(yp('revenue',py))+'백만원',[`매출_올해`]:fmt(yp('revenue',y))+'백만원',
   '생산량_전년':fmt(yp('production',py))+'톤','생산량_올해':fmt(yp('production',y))+'톤',
   '부채비율':fmt(latestRatio('debt_ratio'),1)+'%','28일강도':q?fmt(q.value,2)+'MPa':'','인증수':recs('C').length+'건','특허수':recs('D').filter(r=>r.status==='등록').length+'건',
   '납품현장수':recs('E').length+'곳'}; }
function latestRatio(id){const m=MET[id];const a=latestVal(m.deps[0]),b=latestVal(m.deps[1]);return a==null||!b?null:a/b*100;}
function fillVars(t){const V=VARS();return String(t||'').replace(/\{\{([^}]+)\}\}/g,(s,k)=>V[k.trim()]!=null&&V[k.trim()]!==''?V[k.trim()]:s);}

/* ---------- 만료 알림 ---------- */
function expiryItems(){ const out=[];
  for(const sec of INFO){ if(sec.type!=='list') continue; const ef=sec.fields.filter(f=>f.expiry);
    for(const r of recs(sec.id)){ if(r.status==='완료'||r.status==='소멸'||r.status==='탈락') continue;
      for(const f of ef) if(r[f.k]) out.push({sec:sec.id,secName:sec.name,name:r[sec.title]||'-',field:f.l,date:r[f.k],dd:daysTo(r[f.k])}); } }
  return out.sort((a,b)=>a.dd-b.dd); }
const ddBadge=dd=>dd<0?`<span class="fail">만료 ${-dd}일 지남</span>`:dd<=30?`<span class="warn-b">D-${dd}</span>`:`<span class="pass">D-${dd}</span>`;

/* ---------- 화면: 대시보드 ---------- */
function vDash(){ const ys=[...new Set([...ENTRIES.map(e=>(e.date||'').slice(0,4)).filter(Boolean),''+thisYear()])].sort();
  const y=+(UI.year&&ys.includes(UI.year)?UI.year:ys[ys.length-1]), py=y-1;
  const rev=yp('revenue',y), prev=yp('revenue',py); const yoy=prev?(rev-prev)/Math.abs(prev)*100:null;
  const prod=yp('production',y), ship=yp('shipment',y);
  const qs=METRICS.filter(m=>m.spec); const qe=ENTRIES.filter(e=>MET[e.metric]&&MET[e.metric].spec&&(e.date||'').startsWith(''+y));
  const qok=qe.filter(e=>isOk(MET[e.metric],e.value)).length;
  const debt=series('debt_ratio',[{key:''+y,start:y+'-01-01',end:y+'-12-31'}])[0].total;
  const tile=(l,v,u,d)=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}<small>${u}</small></div><div class="d">${d||'&nbsp;'}</div></div>`;
  const ps=periods(y+'-01-01',y+'-12-31','month'); const sr=series('revenue',ps);
  const dn=MET.revenue.dims.filter(d=>sr.some(p=>p.dims[d])); if(sr.some(p=>p.dims['(미지정)'])) dn.push('(미지정)');
  const stacks=dn.map((d,i)=>({name:d,color:PALETTE[i%8],vals:sr.map(p=>p.dims[d]||null)}));
  const segTot=stacks.map(s=>({name:s.name,color:s.color,v:s.vals.reduce((a,v)=>a+(v||0),0)})); const segSum=segTot.reduce((a,s)=>a+s.v,0)||1;
  const pr=series('production',ps), sh=series('shipment',ps);
  const exp=expiryItems().filter(x=>x.dd<=60).slice(0,6);
  const sites=recs('E').filter(r=>r.status!=='완료').slice(0,5);
  const sup=recs('F'); const stOrder=['준비','신청','선정','진행','완료','탈락']; const st={}; sup.forEach(r=>st[r.status||'준비']=(st[r.status||'준비']||0)+1);
  return `<div class="row"><div><h1>경영 대시보드</h1><p class="lead">${esc(companyName())} · 기준연도 ${y}</p></div><span class="sp"></span>
    <label class="note" for="f-year">기준연도</label><select id="f-year">${ys.map(v=>`<option ${+v===y?'selected':''}>${v}</option>`).join('')}</select></div>
  ${sampleBanner()}
  <div class="tiles t5">
   ${tile(`${y} 매출 누계`,fmt(rev),'백만원',yoy==null?'전년 데이터 없음':`전년 대비 <b class="${yoy>=0?'up':'down'}">${yoy>=0?'▲':'▼'} ${Math.abs(yoy).toFixed(1)}%</b>`)}
   ${tile(`${y} 생산량`,fmt(prod),'톤',`출하 ${fmt(ship)}톤`)}
   ${tile('생산 대비 출하율',fmt(prod?ship/prod*100:null,1),'%','출하량 ÷ 생산량')}
   ${tile(`${y} 품질시험 적합률`,fmt(qe.length?qok/qe.length*100:null,1),'%',qe.length?`${qe.length}회 중 적합 ${qok}회`:'시험 기록 없음')}
   ${tile('부채비율',fmt(debt,1),'%',`상시근로자 ${fmt(latestVal('headcount'))}명`)}
  </div>
  <div class="g21">
   <div class="card"><h2>${y}년 월별 매출 <span class="tag">A-1</span></h2>${rev!=null?chart({labels:ps.map(p=>+p.key.slice(5)+'월'),stacks,unit:'백만원'})+legend(stacks):'<div class="empty">올해 매출 입력이 없습니다.</div>'}</div>
   <div class="card"><h2>제품별 매출 구성</h2>${segTot.length?`<div class="list">${segTot.map(s=>`<div><div class="row"><span>${esc(s.name)}</span><span class="sp"></span><span class="note">${fmt(s.v)}백만원 · ${fmt(s.v/segSum*100,1)}%</span></div><div class="bar"><i style="width:${(s.v/segSum*100).toFixed(1)}%;background:var(${s.color})"></i></div></div>`).join('')}</div>`:'<div class="empty">데이터 없음</div>'}</div>
  </div>
  <div class="g21">
   <div class="card"><h2>${y}년 월별 생산·출하 <span class="tag">P-1</span> <span class="tag">P-2</span></h2>${prod!=null?chart({labels:ps.map(p=>+p.key.slice(5)+'월'),stacks:[{name:'생산량',color:'--s1',vals:pr.map(p=>p.total)},{name:'출하량',color:'--s2',vals:sh.map(p=>p.total)}],unit:'톤',line:true})+legend([{name:'생산량',color:'--s1'},{name:'출하량',color:'--s2'}]):'<div class="empty">올해 생산 입력이 없습니다.</div>'}</div>
   <div class="card"><h2>품질 최근 판정</h2><div class="list">${qs.map(m=>{const l=lastQc(m.id);return `<div class="li"><span class="t">${esc(m.label)}<br><span class="note">${l?esc(l.date)+' · '+fmt(l.value,2)+esc(m.unit):'기록 없음'}</span></span>${l?judge(m,l.value):''}</div>`;}).join('')}</div><p style="margin:10px 0 0"><a href="#qc">품질 현황 보기</a></p></div>
  </div>
  <div class="g3">
   <div class="card"><h2>만료·기한 (60일 이내)</h2>${exp.length?`<div class="list">${exp.map(x=>`<div class="li"><span class="t"><b>${esc(x.name)}</b><br><span class="note">${esc(x.secName)} · ${esc(x.field)} ${esc(x.date)}</span></span>${ddBadge(x.dd)}</div>`).join('')}</div>`:'<div class="empty">60일 안에 다가오는 기한이 없습니다.</div>'}<p style="margin:10px 0 0"><a href="#alerts">전체 알림 보기</a></p></div>
   <div class="card"><h2>진행 중 납품 현장</h2>${sites.length?`<div class="list">${sites.map(r=>`<div class="li"><span class="t"><b>${esc(r.name)}</b><br><span class="note">${esc([r.gc,r.method,r.qty].filter(Boolean).join(' · '))}</span></span><span class="badge">${esc(r.status||'진행')}</span></div>`).join('')}</div>`:'<div class="empty">등록된 현장이 없습니다. <a href="#info-E">납품 현장</a>에서 추가하세요.</div>'}</div>
   <div class="card"><h2>지원사업 현황</h2>${sup.length?`<div class="list">${stOrder.filter(s=>st[s]).map(s=>`<div class="li"><span>${s}</span><b>${st[s]}건</b></div>`).join('')}</div><p class="note" style="margin:8px 0 0">선정·진행·완료 정부지원금 합계 ${fmt(sup.filter(r=>['선정','진행','완료'].includes(r.status)).reduce((a,r)=>a+(num(r.gov)||0),0))}백만원</p>`:'<div class="empty">등록된 지원사업이 없습니다. <a href="#info-F">지원사업 이력</a>에서 추가하세요.</div>'}</div>
  </div>`; }

/* ---------- 화면: 기업정보 ---------- */
function fieldInput(f,v,pre){ const id=pre+f.k; const val=v??'';
  const ctl=f.opt?`<select id="${id}" name="${f.k}"><option value=""></option>${f.opt.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`
   :f.ta?`<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`
   :`<input id="${id}" name="${f.k}" type="${f.t==='date'?'date':f.t==='number'?'number':'text'}" ${f.t==='number'?'step="any"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''} autocomplete="off">`;
  return `<label class="${f.full||f.ta?'full':''}" for="${id}">${esc(f.l)}${f.expiry?' <span class="tag">알림</span>':''}${ctl}</label>`; }
function vInfo(secId){ const sec=INFO_BY[secId]||INFO[0];
  const tabs=`<div class="side">${INFO.map(s=>`<a href="#info-${s.id}" ${s.id===sec.id?'aria-current="page"':''}>${s.id}. ${esc(s.name)}${s.type==='list'?` <span class="note">${recs(s.id).length}</span>`:''}</a>`).join('')}</div>`;
  let body='';
  if(sec.type==='form'){ const m=master(sec.id);
    body=`<div class="card"><h2>${sec.id}. ${esc(sec.name)}</h2><p class="why">${esc(sec.desc)}</p>
     <form class="form" data-form="master" data-sec="${sec.id}">${sec.fields.map(f=>fieldInput(f,m[f.k],'m-'+sec.id+'-')).join('')}
     <div class="full row"><button class="btn pri" type="submit" ${canWrite?'':'disabled'}>저장</button>${m._at?`<span class="note">마지막 저장 ${new Date(m._at).toLocaleString('ko-KR')}</span>`:''}</div></form>
     ${sec.id==='G'?`<p class="note" style="margin:14px 0 0">쓸 수 있는 변수 (클릭하면 복사)</p><div class="vars">${Object.keys(VARS()).map(k=>`<code data-copy="{{${esc(k)}}}" role="button" tabindex="0">{{${esc(k)}}}</code>`).join('')}</div>`:''}</div>`;
  } else { const ed=UI.editRec&&RECORDS.find(r=>r.id===UI.editRec&&r.cat===sec.id); const rows=recs(sec.id);
    body=`<div class="g2"><div class="card"><h2>${ed?'수정':'추가'} · ${esc(sec.name)}</h2><p class="why">${esc(sec.desc)}</p>
      <form class="form" data-form="record" data-sec="${sec.id}">${sec.fields.map(f=>fieldInput(f,ed?ed[f.k]:'','r-'+sec.id+'-')).join('')}
      <div class="full row"><button class="btn pri" type="submit" ${canWrite?'':'disabled'}>${ed?'수정 저장':'추가'}</button>${ed?'<button class="btn" type="button" id="b-cancel-edit">취소</button>':''}</div></form></div>
     <div class="card"><h2>${esc(sec.name)} 목록 <span class="note">${rows.length}건</span></h2>${rows.length?`<div class="tw"><table><tr>${sec.fields.slice(0,5).map(f=>`<th>${esc(f.l)}</th>`).join('')}<th></th></tr>
      ${rows.map(r=>`<tr>${sec.fields.slice(0,5).map(f=>`<td>${esc(r[f.k]||'')}${f.k===sec.title&&r.sample?'<span class="sample">예시</span>':''}</td>`).join('')}<td>${canWrite?`<button class="btn sm" data-edit="${esc(r.id)}">수정</button> <button class="btn sm ghost" data-delrec="${esc(r.id)}">삭제</button>`:''}</td></tr>`).join('')}</table></div>`:'<div class="empty">아직 없습니다. 왼쪽 양식으로 추가하세요.</div>'}</div></div>`; }
  return `<div><h1>기업정보</h1><p class="lead">신청서·제출서류에 반복해서 쓰는 정보를 한곳에 모아 둡니다. 여기 저장한 내용이 「신청서 작성」에 자동으로 채워집니다.</p></div>${tabs}${body}`; }

async function copyText(t,okMsg){ try{await navigator.clipboard.writeText(t);toast(okMsg||'복사했습니다');}catch(err){toast('복사할 수 없습니다. 직접 선택해 복사하세요.');} }
async function saveFile(filename,data){ let dl=null; try{dl=await window.claude?.use?.('downloads');}catch(err){}
  if(!dl){ try{ const url=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/csv;charset=utf-8'})); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},3000); }catch(err){ toast('파일을 저장하지 못했습니다. 복사를 이용하세요.'); } return; }
  try{await dl.save({filename,data});}catch(err){ if(err&&err.code!=='declined'&&err.code!=='dismissed') toast('파일을 저장하지 못했습니다.'); } }

function loadLocal(){try{const raw=localStorage.getItem(LKEY); const j=raw?JSON.parse(raw):SEED;ENTRIES=j.entries||[];RECORDS=j.records||[];MASTER=j.master||{};}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({entries:ENTRIES,records:RECORDS,master:MASTER}));}catch(e){}}
const lid=()=>'l'+Date.now()+Math.random().toString(36).slice(2,6);
const failMsg=err=>toast(err&&err.code==='not_granted'?'저장 권한이 없습니다.':'저장하지 못했습니다. 잠시 후 다시 시도하세요.');
async function addEntry(rec){ if(col){ try{ await col.add(rec); return true; }catch(err){ failMsg(err); return false; } }
  ENTRIES.push({...rec,id:lid()}); saveLocal(); render(true); return true; }
async function removeEntry(id,quiet){ if(col){ try{ await col.doc(id).delete(); if(!quiet) toast('삭제했습니다'); }catch(err){ toast('삭제하지 못했습니다.'); } return; }
  ENTRIES=ENTRIES.filter(e=>e.id!==id); saveLocal(); if(!quiet){ render(true); toast('삭제했습니다'); } }
async function saveMaster(id,data){ if(db){ try{ await db.doc('master/'+id).set(data); return true; }catch(err){ failMsg(err); return false; } }
  MASTER[id]=data; saveLocal(); return true; }
async function saveRecord(id,data){ if(rcol){ try{ if(id) await rcol.doc(id).set(data); else await rcol.add(data); return true; }catch(err){ failMsg(err); return false; } }
  if(id) RECORDS=RECORDS.map(r=>r.id===id?{...data,id}:r); else RECORDS.push({...data,id:lid()}); saveLocal(); return true; }
async function removeRecord(id,quiet){ if(rcol){ try{ await rcol.doc(id).delete(); if(!quiet) toast('삭제했습니다'); }catch(err){ toast('삭제하지 못했습니다.'); } return; }
  RECORDS=RECORDS.filter(r=>r.id!==id); saveLocal(); if(!quiet){ render(true); toast('삭제했습니다'); } }
async function importJson(txt){ let j; try{ j=JSON.parse(txt); }catch(e){ toast('JSON 형식이 올바르지 않습니다. 백업한 내용을 그대로 붙여 넣으세요.'); return; }
  const pr=$('#prog2'); let k=0; const tick=()=>{k++; if(pr) pr.textContent=k+'건';};
  for(const [id,v] of Object.entries(j.master||{})){ if(INFO_BY[id]){ await saveMaster(id,v); tick(); } }
  for(const r of j.records||[]){ const {id,...d}=r; if(!d.cat) continue; if(rcol&&id){ try{await rcol.doc(id).set(d);}catch(e){} } else await saveRecord(null,d); tick(); }
  for(const r of (j.entries||j.metrics||[])){ const {id,...d}=r; if(!d.metric) continue; d.value=Number(d.value); if(col&&id){ try{await col.doc(id).set(d);}catch(e){} } else await addEntry(d); tick(); }
  if(pr) pr.textContent=''; toast(`${k}건을 가져왔습니다`); render(true); }
function fallback(msg){ loadLocal(); loaded=true; setStatus(msg); render(true); }
async function boot(){ render(true);
  let timer=setTimeout(()=>{ if(!loaded) fallback('공유 저장소에 연결하지 못해 이 브라우저에만 저장합니다'); },10000);
  try{ db=await window.claude?.use?.('db'); }catch(e){ db=null; }
  if(!db){ clearTimeout(timer); if(!loaded) fallback('이 브라우저에 저장됩니다'); return; }
  col=db.collection('entries'); rcol=db.collection('records');
  const got={e:false,r:false,m:false}; const ready=()=>{ if(got.e&&got.r&&got.m){ clearTimeout(timer); loaded=true; setStatus(`공유 저장소 · 지표 ${ENTRIES.length}건 · 기록 ${RECORDS.length}건`); render(); } };
  const onErr=()=>{ clearTimeout(timer); col=null; rcol=null; db=null; if(!loaded) fallback('공유 저장소를 읽지 못해 이 브라우저에만 저장합니다'); };
  col.onSnapshot(s=>{ ENTRIES=s.docs.map(d=>({...d.data(),id:d.id})).map(e=>({...e,value:Number(e.value)})); got.e=true; ready(); },onErr);
  rcol.onSnapshot(s=>{ RECORDS=s.docs.map(d=>({...d.data(),id:d.id})); got.r=true; ready(); },onErr);
  db.collection('master').onSnapshot(s=>{ MASTER={}; s.docs.forEach(d=>MASTER[d.id]=d.data()); got.m=true; ready(); },onErr); }
boot();
